gene: BRCA1
seed: 42
layer: 26

evo2:
  # Must be evo2_7b_262k, not evo2_7b — the Goodfire SAE is architecturally
  # tied to the 262k variant (MLP intermediate 11264 vs 11008). See
  # docs/goodfire_query.md for the model-variant audit.
  model_name: evo2_7b_262k
  local_path: null
  device: cuda
  max_new_tokens: 512

sae:
  model_id: Goodfire/Evo-2-Layer-26-Mixed

probe:
  feature_mask_size: 100
  cv_folds: 5
  max_iter: 1000
  C: 1.0

steering:
  n_iterations: 200
  n_warmup: 10
  eps: 0.001
  # Stop after `patience` consecutive iters without > eps improvement in
  # best-so-far reward (past warmup). Single-iter improvement is too tight
  # with a 1000-D GP and only ~10 warmup observations — one unlucky GP
  # suggestion would otherwise terminate the run before the optimizer had
  # any information to work with.
  patience: 30
  guard_quantile_low: 0.01
  guard_quantile_high: 0.99

gp:
  bounds_low: 0.0
  bounds_high: 3.0
  # Decouple search-dim from steer-dim. The patch still hits all |mask|
  # features; the GP only optimizes in `search_dim` ≤ |mask|. 1-D + "uniform"
  # is the sanity baseline (single scalar amplifies the whole mask) — if BO
  # can't beat random here, the reward signal itself is flat and no
  # higher-dim search will help.
  search_dim: 1
  projection: uniform
  # Per-mask-feature sign of the Phase-0 probe coefficient (+1 / 0 / -1).
  # Only required by `projection: pathogenic_split`; the Modal entrypoint
  # populates this from /weights/runs/phase0/<gene>/mask_signs.json before
  # constructing the policy. Leave null for the uniform projection.
  signs: null

acquisition:
  xi: 0.01

reward:
  # `probe_variant` — score the variant-position SAE features under the patch
  # through the Phase-0 probe. `downstream_diff` — the legacy AM+CADD-on-diff
  # reward that was Goodhart-exposed at the Week 4 MAVE gate. See
  # docs/decisions.md 2026-05-26. `downstream_diff` is preserved (not deleted)
  # so the failed run is reproducible from the same code.
  kind: probe_variant
  # Legacy `downstream_diff` weights — unused under `kind: probe_variant`.
  am_weight: 0.5
  cadd_weight: 0.5

data:
  # ClinVar: laptop default. On Modal this is overridden in
  # utils.modal_app::phase0 to /weights/clinvar/variant_summary.txt.gz
  # after cache_clinvar() has populated the Volume.
  clinvar_path: data/clinvar/variant_summary.txt.gz
  # GRCh38 reference directory holding per-chromosome chr<N>.fa files. Modal
  # phase0 overrides this to /weights/reference/grch38 after cache_reference.
  reference_path: data/reference/grch38
  # ±N bp window around each variant; output sequence length = 2N+1.
  sequence_window: 512
  mave_path: data/mave_${gene}.csv
  alphamissense_path: data/alphamissense_scores.parquet
  cadd_path: data/cadd_scores.tsv.gz

wandb:
  project: causal-steering
  entity: null
