defaults:
  - base
  - _self_

# Which optimization arm runs. `bayesopt` (GP+EI, implemented) or `ppo` (RL,
# lands Week 5 per ROADMAP.md). Never call the bayesopt arm "RL" — see
# docs/decisions.md (2026-05-19 ADR).
method: bayesopt

feature_mask_path: runs/phase0/${gene}/feature_mask.json
probe_path: runs/phase0/${gene}/probe.json
output_dir: runs/steering/${gene}/${method}/seed_${seed}
